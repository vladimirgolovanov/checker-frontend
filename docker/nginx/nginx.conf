server {
    listen 80 default;

    client_max_body_size 108M;

    access_log /var/log/nginx/application.access.log;

    root /application;
    index index.html;

    location / {
        proxy_pass http://host.docker.internal:5173/;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:37011/api/;
    }
}
