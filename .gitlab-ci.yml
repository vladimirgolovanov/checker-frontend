stages:
  - build
  - deploy

build:
  stage: build
  image: docker:latest
  only:
    - master
  services:
    - docker:dind
  script:
    - echo "Building the app"
    - touch ENV_PROD
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose --project-name aboo_frontend --file=docker-compose-prod-aboo-frontend.yml build
    - docker compose --project-name aboo_frontend --file=docker-compose-prod-aboo-frontend.yml push

deploy:
  stage: deploy
  image: docker:latest
  only:
    - master
  services:
    - docker:dind
  script:
    - echo "Deploying the app"
    - chmod og= $ID_RSA
    - apk update && apk add openssh-client
    - scp -i $ID_RSA -o StrictHostKeyChecking=no docker-compose-prod-aboo-frontend.yml $SERVER_USER@$SERVER_IP:/projects/aboo/frontend/docker-compose-prod-aboo-frontend.yml
    - scp -r -i $ID_RSA -o StrictHostKeyChecking=no docker $SERVER_USER@$SERVER_IP:/projects/aboo/frontend
    - echo "docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd /projects/aboo/frontend && docker compose --project-name aboo_frontend --file=docker-compose-prod-aboo-frontend.yml pull"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd /projects/aboo/frontend && docker compose --project-name aboo_frontend --file=docker-compose-prod-aboo-frontend.yml down"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd /projects/aboo/frontend && docker compose --project-name aboo_frontend --file=docker-compose-prod-aboo-frontend.yml up -d --remove-orphans"
